name: Publish MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/reidgoodbar/squire-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="v${version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
              exit 1
            fi
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run CLI tests
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: registry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SQUIRE_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/reidgoodbar/squire
            org.opencontainers.image.description=Squire MCP stdio server wrapper
            io.modelcontextprotocol.server.name=io.github.reidgoodbar/squire

      - name: Wait for GHCR tag visibility
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          for _ in $(seq 1 18); do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "image not visible yet: $image" >&2
          exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate mcp-publisher with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        working-directory: registry
        run: ../mcp-publisher publish
