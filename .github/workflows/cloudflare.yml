name: cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/squire-run/**"
      - ".github/workflows/cloudflare.yml"

jobs:
  deploy:
    name: Deploy squire.run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy -c cloudflare/squire-run/wrangler.toml
