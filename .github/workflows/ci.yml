name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native differential tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Prepare writable Go cache
        run: mkdir -p "$GOCACHE" .tmp

      - name: Installer syntax
        run: sh -n install.sh

      - name: Unit tests
        run: go test ./...

      - name: Benchmark analysis tests
        run: |
          python3 -m unittest \
            scripts/test_codex_call_amplification_ab.py \
            scripts/test_codex_attributable_ab.py

      - name: Native runtime warnings
        run: |
          cc -O3 -DNDEBUG -Wall -Wextra -Werror -Wno-unused-function \
            -shared -fPIC \
            -o .tmp/libsquire_runtime.so \
            shims/squire_hot_api.c \
            -ldl -lcrypto

      - name: Cache validity regressions
        run: |
          tests='TestHotSnapshotDoesNotReplayRepoSummaryAcrossCWD|TestProofGatedStatusDoesNotReplayWhenDefaultGlobalGitIgnoreChanges|TestProofGatedStatusDoesNotReplayWhenIncludedGitConfigChanges|TestProofGatedDiffDoesNotReplayWhenDefaultGlobalGitAttributesChange|TestProofGatedStatusDoesNotReplayWhenConfiguredGitExcludesFileChanges|TestProofGatedDiffDoesNotReplayWhenConfiguredGitAttributesFileChanges'
          go test ./internal/proofcache -run "$tests" -count=1

      - name: VM status
        run: go run ./cmd/squire vm status --short

      - name: Repo metadata benchmark
        run: go run ./cmd/squire boost bench repo-metadata

      - name: Release smoke
        run: |
          go build -o .tmp/squire ./cmd/squire
          scripts/release_smoke.sh .tmp/squire

      - name: Hot API squire-codex regression
        run: python3 scripts/hot_api_fuzz.py .tmp/squire --cases 75 --seed 20260703

      - name: Adapter path benchmark
        run: scripts/adapter_path_bench.py .tmp/squire

      - name: Strict replay budget
        run: scripts/edge_stress.py .tmp/squire --scenario echo --normal-ux --strict-performance
